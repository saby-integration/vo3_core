* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

body {
    background-color: #FFF;
}

#main {
    margin: 0px;
}

.transport-title {
    font-weight: 600;
    font-style: normal;
    font-size: 24px;
    margin-bottom: 5px;
    font-family: "Maison Neue Extended Demi", "InterRegular", "sabyInterIE", sans-serif
}

.transport-buttons {
    margin-bottom: 5px;
    display: inline;
    font-size: 0;
}

.transport-button {
    box-sizing: border-box;
    display: inline-block;
    padding: 12px;
    cursor: pointer;
    margin-bottom: 12px;
    /*Для поддержки прозрачности в ie < 8*/
    filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#0c333333', endColorstr='#0c333333'); /* Фильтр для прозрачного фона */
    /*Для поддержки прозрачности в ie8*/
    -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#0c333333', endColorstr='#0c333333')";
    background-color: #FFFFFF;
    border: solid 1px #ccc;
    border-radius: 10px;
    box-shadow: none;
    font-weight: 400;
    font-style: normal;
    font-size: 16px;
    margin-right: 12px;
    width: 250px;
    height: 90px;    
    vertical-align: top;
}

.transport-button:hover {
    -moz-box-shadow: 0px 0px 20px rgba(0,0,0,0.137254901960784);
    -webkit-box-shadow: 0px 0px 20px rgba(0,0,0,0.137254901960784);
    box-shadow: 0px 0px 20px rgba(0,0,0,0.137254901960784);
    cursor: pointer;
}

.transport-button__product {
    display: inline;
    color: #313E78;
    margin-right: 5px;
    font-weight: 700;
    font-size: 18px;
    font-style: normal;
    line-height: 21px;
    font-family: "Maison Neue Extended Demi", "InterRegular", "sabyInterIE", sans-serif
}

.transport-button__name {
    display: inline;
    font-weight: 400;
    font-style: normal;
    font-size: 14px;
    line-height: 21px;
}

.transport-button__description {
    font-weight: 400;
    font-style: normal;
    font-size: 12px;
    color: #999999;
    line-height: 17px;
}

.transport-text {
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: normal;
    font-size: 15px;
    line-height: 19px;
    margin-bottom: 21px;
}

#commands-container {
    background-color: #FFFFFF;
    border-radius: 10px;
    padding: 12px 12px 0px 12px;
    box-sizing: border-box;
    margin-top: 9px;
    border-width: 1px;
    border-style: solid;
    border-color: #FFFFFF;
    -webkit-box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.0588235294117647);
    -moz-box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.0588235294117647);
    box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.0588235294117647);
}

.commands-count {
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: normal;
    font-size: 15px;
    margin-bottom: 20px;
}

#recieve-command-name, #recieve-command-uuid, #send-command-status {
    display: inline;
    margin-right: 10px;
    font-weight: 400;
    font-style: normal;
    font-size: 15px;
}

#recieve-command-uuid {
    color: #8991A9;
}

#recieve-command-button, #send-command-button {
    font-weight: 400;
    font-style: normal;
    font-size: 15px;
}

.last-command {
    font-optical-sizing: auto;
    font-weight: 600;
    font-style: normal;
    font-size: 16px;
    letter-spacing: 1px;
    margin-bottom: 9px;
}

.hide {
    display: none;
}

.margin-top {
    margin-top: 4px;
}

.status {
    margin-bottom: 16px;
}

h4 {
    margin-top: 8px;
    margin-bottom: 8px;
}

#recieve-command-show, #send-command-show {
    font-weight: 400;
    font-style: normal;
    cursor: pointer;
    display: inline-block;
    margin-bottom: 12px;
}

.arrow {
    width: 16px;
    height: 11px;
    cursor: pointer;
    transform-origin: 50% 50%;
    margin-left: -2px;
    filter: invert(63%) sepia(7%) saturate(913%) hue-rotate(187deg) brightness(91%) contrast(86%);
}

.command-button-bold {
    font-weight: 700;
    color: #313E78 !important;
}

.up {
    transform: rotate(-90deg); /* Стрелка вверх */
}

.down {
    transform: rotate(90deg); /* Стрелка вниз */
}

#recieve-command-time, #recieve-command-time-sap, #send-command-time,
#command-elapsed-time-wrapper, #command-elapsed-time, #send-command-data,
#recieve-command-data  {
    font-weight: 400;
    font-style: normal;
    font-size: 15px;
}

#send-command-time {
    margin-left: 20px;
}

#recieve-command-time {
    margin-left: 27px;
}

#send-command-data {
    padding-bottom: 12px;
}

#recieve-command-time-sap {
    margin-left: 28.4px;
}

#recieve-command-data {
    margin-bottom: 13px;
}

#command-elapsed-time {
    font-size: 15px;
}



* {
    font-family: "sabyInter", sans-serif;
}

#commands-container {
    font-family: "sabyInterIE", "sabyInter", sans-serif;
}

.commands-count p, #recieve-command-name, #recieve-command-uuid, #send-command-status,
#recieve-command-show div span, #recieve-command-time, #send-command-show div #send-command-button,
#recieve-command-data, #send-command-data, #send-command-time, #command-elapsed-time {
    font-family: "sabyInterIE", "sabyInter", sans-serif;
}
</style></head><body>
<div id="main">
	
<div id="transport-buttons" class="transport-buttons">
		%productlist%
    </div>
</div>
</body></html>
